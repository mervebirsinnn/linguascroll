packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # opencollective || exit 0 -- zararsız funding/bağış mesajı, bilinen NestJS deseni
  '@nestjs/core': true
  # Chunk 15 — "prepare": "node scripts/prepare.js", ama yayınlanan pakette
  # scripts/ dizini YOK (paketten hariç tutulmuş, sadece kaynak repo için) —
  # install sırasında gerçekte çalışacak bir şey yok (kaynağı incelenip
  # doğrulandı: apps/api/node_modules/.pnpm altında scripts/ bulunmuyor).
  '@google/genai': true
  # node install.js -- platforma özel esbuild binary'sini seçer, drizzle-kit'in transitive bağımlılığı
  esbuild: true
  # postinstall sadece bir version-scheme uyarısı yazıyor (stderr), dosya/ağ
  # erişimi yok — kaynağı incelenip doğrulandı (scripts/postinstall.js).
  protobufjs: true
  # postinstall, mevcut platforma özel workerd (Cloudflare Workers runtime)
  # native binary'sini indiriyor -- esbuild ile aynı desen (platform binary
  # seçici), wrangler/media-worker'ın yerel çalışması için gerekli, resmi
  # Cloudflare paketi.
  workerd: true
  # postinstall, mevcut platforma özel sentry-cli native binary'sini indiriyor
  # -- esbuild/workerd ile aynı desen (platform binary seçici), source map
  # upload için gerekli, resmi Sentry paketi.
  '@sentry/cli': true
  # postinstall SADECE FIREBASE_WEBAPP_CONFIG env'i varsa Firebase App Hosting için
  # otomatik web-app config dosyası yazıyor (kaynağı incelendi: postinstall.js) —
  # kullanmıyoruz (config açıkça env'den veriliyor), bu yüzden bilinçli olarak KAPALI.
  '@firebase/util': false
