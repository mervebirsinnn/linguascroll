name = "linguascroll-media-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Chunk 17 — R2'nin kendi r2.dev public dev subdomain'i bazı ağlarda TLS
# handshake sırasında connection reset veriyor (gerçek network kısıtlaması,
# Cloudflare/bucket config sorunu değil — bkz. r2-storage.service.ts'teki
# buildPlaybackUrl yorumu). Bu Worker, r2.dev'i tamamen bypass edip aynı
# bucket'ı kendi workers.dev subdomain'i üzerinden read-only serve eder.
#
# R2 bucket binding kullanılıyor: Worker'a hiçbir R2 access key/secret
# GEÇMİYOR, Cloudflare runtime binding'i doğrudan bucket'a bağlıyor.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "linguascroll-videos"
